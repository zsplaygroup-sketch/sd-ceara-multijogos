<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD Ceará Multijogos V0.3</title><style>
:root{--green:#00d76b;--gold:#f7c84b;--silver:#f0f2f3}*{box-sizing:border-box}body{margin:0;background:#050908;color:var(--silver);font-family:Arial,sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 20%,#07552b75,transparent 58%),linear-gradient(145deg,#060908,#101410 70%,#050908)}.wrap{position:relative;max-width:1150px;margin:auto;padding:28px 26px 40px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d2ad4a55;padding-bottom:12px}.brand{font-weight:900;color:var(--gold);letter-spacing:.14em}.ver{font-size:12px;color:#a3b9ad}.hero{text-align:center;padding:12px 0 16px}.logo{display:block;width:min(370px,75vw);height:240px;object-fit:contain;margin:0 auto;filter:drop-shadow(0 0 16px #00cf6550);animation:rise 1.3s both}.hero h1{margin:0;color:var(--gold);letter-spacing:.23em;font-size:clamp(20px,3.8vw,34px);text-shadow:0 0 14px #9b740b99}.hero p{margin:9px 0;color:#d8dfda}.bar{height:3px;background:linear-gradient(90deg,transparent,var(--green),var(--gold),transparent);margin:18px 0 24px;box-shadow:0 0 18px #00d76b88}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tile{background:linear-gradient(155deg,#11251b,#0b0f0d);border:1px solid #3e6b4e;border-radius:14px;min-height:116px;cursor:pointer;color:white;text-align:left;padding:18px;transition:.18s;display:flex;flex-direction:column;justify-content:space-between}.tile:focus,.tile.selected,.tile:hover{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px #e4b94455,0 0 24px #08d56d35;transform:translateY(-2px)}.tile .symbol{font-size:27px;color:var(--gold)}.tile .name{font-weight:800;letter-spacing:.04em;font-size:14px}.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;margin-top:24px;color:#b6c6bc;font-size:13px}.status{color:var(--gold)}button.audio{background:#143a25;border:1px solid var(--gold);border-radius:9px;padding:10px 15px;color:white;cursor:pointer}.intro{position:fixed;inset:0;background:radial-gradient(circle at center,#0a361d,#020403 75%);z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .7s}.intro img{width:min(540px,80vw);max-height:60vh;object-fit:contain;animation:rise 1.5s both;filter:drop-shadow(0 0 25px #00d76b88)}.intro strong{font-size:clamp(18px,4vw,36px);color:var(--gold);letter-spacing:.2em;animation:rise 1.6s .6s both}.intro small{margin-top:15px;color:#d6dfd8}.intro.hide{opacity:0;pointer-events:none}@keyframes rise{from{opacity:0;transform:scale(.86) translateY(15px)}to{opacity:1;transform:scale(1) translateY(0)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.logo{height:170px}.tile{min-height:100px}}
</style></head><body><div class="intro" id="intro"><img src="assets/logo-sd-ceara.png" alt="Logo oficial SD Ceará Games"><strong>MULTIJOGOS</strong><small>Seu Bairro Joga Aqui. Diversão que cabe no seu bolso.</small></div><div class="wrap"><header class="top"><span class="brand">SD CEARÁ GAMES</span><span class="ver">MULTIJOGOS • V0.3 • PRÉVIA</span></header><section class="hero"><img class="logo" src="assets/logo-sd-ceara.png" alt="Logo oficial SD Ceará Games"><h1>MULTIJOGOS</h1><p>Seu Bairro Joga Aqui. Diversão que cabe no seu bolso.</p></section><div class="bar"></div><main class="grid" id="grid"></main><footer class="foot"><span>← → ↑ ↓ Selecionar • Enter Abrir prévia</span><span class="status" id="status">Interface de demonstração — não executa ELF no navegador</span><button class="audio" id="audio">▶ Ativar áudio original</button></footer></div><audio id="track" src="assets/identidade-sonora-original.wav" loop></audio><script>
const names=['MEGA DRIVE','SUPER NINTENDO','GAME BOY','GAME BOY ADVANCE','ATARI 2600','MASTER SYSTEM','SNESTICLE (ALT)','SUPER MARIO 64'];const symbols=['◈','✦','▣','▤','◆','✧','◇','★'];let selected=0;const grid=document.querySelector('#grid'),status=document.querySelector('#status');names.forEach((n,i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML='<span class="symbol">'+symbols[i]+'</span><span class="name">'+n+'</span>';b.onclick=()=>{select(i);status.textContent='Prévia: '+n+' — ELF será integrado no PS2'};grid.append(b)});function select(i){selected=(i+names.length)%names.length;[...grid.children].forEach((b,j)=>b.classList.toggle('selected',j===selected))}select(0);window.addEventListener('keydown',e=>{const c=e.key;if(['ArrowRight','ArrowLeft','ArrowDown','ArrowUp','Enter'].includes(c))e.preventDefault();if(c==='ArrowRight')select(selected+1);if(c==='ArrowLeft')select(selected-1);if(c==='ArrowDown')select(selected+4);if(c==='ArrowUp')select(selected-4);if(c==='Enter')grid.children[selected].click()});setTimeout(()=>document.querySelector('#intro').classList.add('hide'),4400);const a=document.querySelector('#track'),btn=document.querySelector('#audio');btn.onclick=async()=>{if(a.paused){try{await a.play();btn.textContent='Ⅱ Pausar áudio original'}catch(e){status.textContent='Áudio bloqueado pelo navegador'}}else{a.pause();btn.textContent='▶ Ativar áudio original'}};
</script></body></html>
